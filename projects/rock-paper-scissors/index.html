<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="fEzt3YLRRcHFoL7wsNWbODkAd_Ft_o6NpXyTAhjJtsI" />
  <title>Rock Paper Scissors Battle - Play Free Online</title>

  <meta name="description"
  content="Play Rock Paper Scissors online for free!
  Challenge yourself, beat your opponent and
  test your luck in this fun RPS battle game.">

  <meta name="keywords"
  content="rock paper scissors, rps game,
  rock paper scissors online, free online games">

  <meta name="robots" content="index, follow">

  <link rel="canonical"
  href="https://play-rps-battle.vercel.app/">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>

  <header class="title-container">
    <img src="./favicon.png" class="image-box" alt="Game logo">
    <p class="title-box">Rock • Paper • Scissors</p>
  </header>

  <main class="game-container">

    <h2 class="choose-container">Choose your move</h2>
    <p class="description-container">Good luck - have fun!</p>

    <div class="buttons-container">

      <button class="rock-button" onclick="playGame('rock')">
        <img src="./images/rock-emoji.png" class="move-icon" alt="">
        Rock
      </button>

      <button class="paper-button" onclick="playGame('paper')">
        <img src="./images/paper-emoji.png" class="move-icon" alt="">
        Paper
      </button>

      <button class="scissors-button" onclick="playGame('scissors')">
        <img src="./images/scissors-emoji.png" class="move-icon" alt="">
        Scissors
      </button>

    </div>

    <section class="result-container" aria-live="polite">
      <p class="r1-box">
        Paper beats Rock <br>
        Rock beats Scissors <br>
        Scissors beats Paper
      </p>
      <p class="r2-box"></p>
    </section>

    <section class="scorecard-container" aria-label="Game score">
      <div class="your-score"></div>
      <div class="computer"></div>
      <div class="ties"></div>
    </section>

    <button class="reset-score-container" onclick="resetGame()">
      Reset Score
    </button>

  </main>

  <footer class="about">
    <a href="https://github.com/harsharagain/codeverse/tree/main/projects/rock-paper-scissors" target="_blank" rel="noopener noreferrer">
      About the project
    </a>
    <span>•</span>
    <a href="https://github.com/harsharagain/" target="_blank" rel="noopener noreferrer">
      harsharagain
    </a>
  </footer>

</body>
</html>
