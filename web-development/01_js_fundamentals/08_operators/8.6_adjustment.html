<body>
    <script>
        let counter = 0;
        counter++;
        alert(counter); // 1
        ++counter;
        alert(counter); // 2
        
        let x = 0;
        alert( x++ ); // 0
        alert( x ); // 1
        alert( ++x ) // 2

        let y = 1;
        alert( 2 ** y++); // 2
        alert( 2 * ++y ); // 4

    </script>
</body>
