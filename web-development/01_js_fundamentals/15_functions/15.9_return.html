<body>
    <script>

        // code 1
        function calSum(a, b) {
            return a + b
        }

        let result = calSum(5, 8);
        alert(result);

        result = calSum("Hi", " ooo");
        alert(result)

        // code 2
        function checkAge(age) {
            if (age >= 18) {
                return true;
            } else {
                return confirm("Do you have permission from your parents?");
            }
        }

        let age = prompt("How old are you?", 18);

        if ( checkAge(age) ) {
            alert( 'Access granted!' );
        } else {
            alert("Access Denied");
        }

    </script>
</body>
