<body>
    <script>

        let x = +prompt("Enter number: ", 5);

        switch(x) {
            case 0:
                alert("Too small");
                break;
            case 1:
                alert("Small");
                break;
            case 2:
                alert("Exactly");
                break;
            case 3:
                alert("Too big");
                break;
            default:
                alert("Noooo!");
        }

    </script>
</body>
