<body>
    <script>

        let x = 5;
        x = -x;
        alert(x); // -5, unary negation applied

        let y = 1, z = 3;
        alert( z - y ); // 2, binary minus subtracts values

        // remainder %
        alert( 5 % 2 ); // 1

        // exponentiation **
        alert( 2 ** 3 ) // 8
    </script>
</body>
