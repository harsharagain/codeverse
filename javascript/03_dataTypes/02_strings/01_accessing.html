<body>
    <script>
        let str = "Hello";
        let len = str.length; // Gives the number of characters in the string

        alert(str[0]);    // H 
        alert(str.at(0)); // H 

        alert(str[len - 1]); // o 
        alert(str.at(-1));   // o 

        alert(str[-1]); // undefined (negative index doesn't work with [])
    </script>
</body>
