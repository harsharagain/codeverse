<body>
  <script>
    // The elements of the array are removed and, if necessary, inserted in their place, returning the deleted elements.

    let arr = ["I", "study", "JavaScript"];

    delete arr[2]; // remove "JavaScript"
    alert( arr[2] ); // undefined: the element is removed
    alert( arr.length ); // 3: it is still 3

    // Syntax: arr.splice(start[, deleteCount, elem1, ..., elemN])
    arr = ["I", "study", "JavaScript", "right", "now"];
    arr.splice(0, 3, "Let's", "code"); // from index 0 remove 3 elements and add others instead
    alert( arr ); // Let's,code,right,now

    arr.splice(1, 1); // from index 1 remove 1 element
    alert( arr ); // Let's,right,now

    arr = ["I", "study", "JavaScript"];
    arr.splice(2, 0, "complex", "language"); // from index 2 remove 0 and add 2 elements
    alert( arr ); // I,study,complex,language,JavaScript

  </script>
</body>
