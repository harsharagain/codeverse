<body>
  <script>
    let arr = ['Apple'];

    let fruits = arr; // copy by reference (two variables reference the same array)
    fruits.push('Orange'); // modify the array by reference
    console.log(arr.length); // 2, now arr is ["Apple", "Orange"]

    console.log(arr === fruits); // true, both variables reference the same array

    fruits[2] = 5; // out-of-bounds property assignment
    console.log(fruits.length); // 3, length is the greatest numeric index + 1
    
    fruits.age = 25; // create a property 'age' in the array
    console.log(fruits.age); // 25

    console.log(fruits); // ['Apple', 'Orange', 5, age: 25]
    console.log(arr); //  ['Apple', 'Orange', 5, age: 25]

  </script>
</body>
