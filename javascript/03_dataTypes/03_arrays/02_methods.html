<body>
  <script>
    let arr = ["Apple", "Orange", "Plum"];

    alert( arr.pop() ); // Plum (removed from the end) and alerted
    alert( arr ); // Apple, Orange 

    arr.push("Pear"); // adds "Pear" to the end
    alert( arr ); // Apple, Orange, Pear

    alert( arr.shift() ); // Apple (removed from the beginning) and alerted
    alert( arr ); // Orange, Pear

    arr.unshift("Pineapple"); // adds "Pineapple" to the beginning
    alert( arr ); // Pineapple, Orange, Pear

    
  </script>
</body>
