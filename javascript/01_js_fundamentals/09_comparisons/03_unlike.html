<body>
    <script>
        // Comparision of different types
        alert( '2' > 1 ); // true, string is automatically converted into integer and then compared
        alert( '01' == 1 ); // true

        alert( true == 1 ); // true
        alert( false == 0 ); // true

        let a = 0;
        alert( Boolean(a) ); // true

        let b = "0";
        alert( Boolean(b) ); // true

        let c = "";
        alert( Boolean(c) ); // false


    </script>
</body>
