<body>
    <script>
        let x = prompt("Enter a value?");

        switch (x) {
            case '0':
            case '1':
                alert('Either One or Zero');
                break;
            case '2':
                alert("Two");
                break;
            case 3:
                alert("Never executes!!!");
                break;
            default:
                alert("Unknown value")
        }
    </script>
</body>
